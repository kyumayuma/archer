<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="wall" cx="0.3" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#3a2e23"/>
      <stop offset="0.4" stop-color="#1b1510"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.55" stop-color="#101829"/>
      <stop offset="0.72" stop-color="#5a4731"/>
      <stop offset="0.78" stop-color="#232530"/>
      <stop offset="1" stop-color="#0c0f18"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2019"/>
      <stop offset="0.25" stop-color="#150f0b"/>
      <stop offset="1" stop-color="#060504"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dca0"/>
      <stop offset="0.5" stop-color="#d8b268"/>
      <stop offset="1" stop-color="#a47f3e"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030504"/>
      <stop offset="0.28" stop-color="#1d2a24"/>
      <stop offset="0.36" stop-color="#6f7d72"/>
      <stop offset="0.42" stop-color="#16201b"/>
      <stop offset="1" stop-color="#020302"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b5530"/>
      <stop offset="0.35" stop-color="#f0d99e"/>
      <stop offset="0.6" stop-color="#b8944f"/>
      <stop offset="1" stop-color="#4a3a20"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d6250"/>
      <stop offset="0.4" stop-color="#e9dfc8"/>
      <stop offset="1" stop-color="#5d5344"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6ead0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f6ead0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c27a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f0c27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="520" y="120" width="210" height="300" rx="96" ry="104"/></clipPath>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>
  <circle cx="160" cy="420" r="300" fill="url(#lamp)"/>

  <!-- 窓 -->
  <rect x="478" y="78" width="294" height="384" rx="136" ry="146" fill="#6a5f4e"/>
  <rect x="498" y="98" width="254" height="344" rx="116" ry="126" fill="#3b342a"/>
  <rect x="512" y="112" width="226" height="316" rx="104" ry="112" fill="#0e0c0a"/>
  <g clip-path="url(#win)">
    <rect x="520" y="120" width="210" height="300" fill="url(#sky)"/>
    <circle cx="664" cy="206" r="80" fill="url(#moonGlow)"/>
    <circle cx="664" cy="206" r="11" fill="#f8eed8"/>
    <ellipse cx="610" cy="352" rx="140" ry="20" fill="#7c7a7e" opacity=".5" filter="url(#b4)"/>
    <ellipse cx="620" cy="392" rx="160" ry="32" fill="#22242d" filter="url(#b4)"/>
    <rect x="520" y="120" width="210" height="300" rx="96" ry="104" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="30" filter="url(#b10)"/>
  </g>

  <!-- テーブル -->
  <rect x="0" y="690" width="800" height="310" fill="url(#table)"/>
  <rect x="0" y="690" width="800" height="3" fill="#c9a96b" opacity=".55"/>
  <rect x="0" y="693" width="800" height="40" fill="#f0c27a" opacity=".05"/>

  <!-- ボトル -->
  <g>
    <path d="M470 740 L470 520 C470 470 496 450 506 420 L506 300 L540 300 L540 420 C550 450 576 470 576 520 L576 740 Z" fill="url(#bottle)"/>
    <path d="M504 300 L542 300 L542 360 C552 370 556 380 556 392 L490 392 C490 380 494 370 504 360 Z" fill="url(#foil)"/>
    <rect x="502" y="292" width="42" height="12" rx="4" fill="#d9bd80"/>
    <rect x="476" y="560" width="94" height="110" fill="url(#label)"/>
    <rect x="476" y="560" width="94" height="110" fill="none" stroke="#b8944f" stroke-width="1.5"/>
    <text x="523" y="604" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#2a2016">ARCHER</text>
    <path d="M500 616 H546" stroke="#8f7650" stroke-width="1"/>
    <text x="523" y="636" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#4a3c2a">CUVÉE NOCTURNE</text>
    <path d="M488 470 C484 520 484 640 486 730" stroke="#fff" stroke-opacity=".22" stroke-width="3" fill="none"/>
  </g>
  <!-- ボトルの映り込み -->
  <g opacity=".22" filter="url(#b4)" transform="translate(0 1480) scale(1 -1)">
    <path d="M470 740 L470 520 C470 470 496 450 506 420 L506 300 L540 300 L540 420 C550 450 576 470 576 520 L576 740 Z" fill="#2a3530"/>
  </g>

  <!-- シャンパングラス -->
  <g>
    <ellipse cx="300" cy="742" rx="62" ry="10" fill="#000" opacity=".5" filter="url(#b4)"/>
    <path d="M262 404 C262 470 272 540 300 582 C328 540 338 470 338 404 Z" fill="#ffffff" fill-opacity=".05"/>
    <path d="M266 456 C268 500 278 548 300 580 C322 548 332 500 334 456 Z" fill="url(#liquid)" opacity=".92"/>
    <ellipse cx="300" cy="456" rx="34" ry="5" fill="#f8e7b8" opacity=".85"/>
    <g fill="#fff4d6" opacity=".8">
      <circle cx="298" cy="560" r="1.6"/><circle cx="301" cy="540" r="1.4"/><circle cx="296" cy="520" r="1.2"/><circle cx="302" cy="500" r="1.5"/><circle cx="299" cy="482" r="1.1"/><circle cx="303" cy="468" r="1"/>
      <circle cx="288" cy="530" r="1"/><circle cx="312" cy="512" r="1.1"/>
    </g>
    <path d="M262 404 C262 470 272 540 300 582 C328 540 338 470 338 404" fill="none" stroke="url(#glassEdge)" stroke-width="2.4"/>
    <ellipse cx="300" cy="404" rx="38" ry="6" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.6"/>
    <path d="M300 582 L300 732" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
    <path d="M298 590 L298 728" stroke="#fff" stroke-opacity=".6" stroke-width="1"/>
    <ellipse cx="300" cy="736" rx="46" ry="7" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".4" stroke-width="1.4"/>
    <path d="M270 420 C272 470 280 520 292 560" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- グラスの映り込み -->
  <g opacity=".18" filter="url(#b4)" transform="translate(0 1484) scale(1 -1)">
    <path d="M266 456 C268 500 278 548 300 580 C322 548 332 500 334 456 Z" fill="#d8b268"/>
    <path d="M300 582 L300 732" stroke="#fff" stroke-width="4"/>
  </g>

  <!-- 小皿 -->
  <ellipse cx="160" cy="760" rx="90" ry="18" fill="#000" opacity=".45" filter="url(#b4)"/>
  <ellipse cx="160" cy="752" rx="86" ry="15" fill="#e7dcc6"/>
  <ellipse cx="160" cy="750" rx="66" ry="10" fill="#cfc3aa"/>
  <ellipse cx="140" cy="744" rx="16" ry="7" fill="#6b3f2a"/>
  <ellipse cx="172" cy="746" rx="14" ry="6" fill="#8a5a36"/>
  <ellipse cx="186" cy="740" rx="8" ry="4" fill="#caa15d"/>

  <circle cx="300" cy="430" r="120" fill="#f0c27a" opacity=".05" filter="url(#b24)"/>
</svg>
